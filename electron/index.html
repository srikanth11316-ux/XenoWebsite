<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>XenoChat Loading</title>
  <style>
    body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0f0f0f; color: #fff; font-family: Arial, sans-serif; }
    .loading { text-align: center; }
    .spinner { border: 3px solid rgba(102,126,234,0.3); border-top: 3px solid #667eea; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <p>Loading XenoChat...</p>
  </div>
  <script>
    setTimeout(() => { window.location.href = 'https://xenowebsite.pages.dev/chat'; }, 500);
  </script>
</body>
</html>
