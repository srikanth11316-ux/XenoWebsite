<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XenoChat - Registered Users</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            min-height: 100vh;
            padding: 40px 20px;
            color: #e0e0e0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            background: #252525;
            color: #ccc;
            font-weight: 600;
        }

        tr:hover td {
            background: #1f1f1f;
        }

        td {
            color: #e0e0e0;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-verified {
            background: rgba(102, 126, 234, 0.2);
            color: #8fa8ff;
            border: 1px solid rgba(102, 126, 234, 0.4);
        }

        .badge-unverified {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.4);
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back-link" href="./chat.html">&larr; Back to Chat</a>
        <h1>Registered Users</h1>
        <p class="subtitle">Track saved usernames, emails, and verification status</p>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Status</th>
                    <th>Created At</th>
                </tr>
            </thead>
            <tbody id="usersTable">
                <tr>
                    <td colspan="6" class="empty">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="config.js"></script>
    <script>
        const API_URL = window.XENOCHAT_CONFIG.API_URL;
        async function loadUsers() {
            try {
                const response = await fetch(`${API_URL}/api/users`);
                const users = await response.json();
                const tbody = document.getElementById('usersTable');

                if (!Array.isArray(users) || users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty">No registered users found.</td></tr>';
                    return;
                }

                tbody.innerHTML = users.map(user => `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                        <td>${user.phone || '-'}</td>
                        <td>
                            <span class="badge ${user.is_verified ? 'badge-verified' : 'badge-unverified'}">
                                ${user.is_verified ? 'Verified' : 'Unverified'}
                            </span>
                        </td>
                        <td>${user.created_at || '-'}</td>
                    </tr>
                `).join('');
            } catch (err) {
                document.getElementById('usersTable').innerHTML = `
                    <tr><td colspan="6" class="empty">Failed to load users: ${err.message}</td></tr>
                `;
            }
        }

        loadUsers();
    </script>
</body>
</html>
